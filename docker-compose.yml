version: '3.9'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    image: fastapi_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
    command: >
      sh -c "python -m alembic upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbit:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
  celery_worker:
    image: fastapi_app
    command: celery -A celery_worker.app worker --loglevel=info --pool=solo
    depends_on:
      - web
      - rabbit
    

  celery_beat:
    image: fastapi_app
    command: celery -A celery_worker.app beat --loglevel=info 
    depends_on:
      - web
      - rabbit

volumes:
  pgdata: